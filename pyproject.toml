[project]
name = "sticky-bridge"
version = "0.1.0"
description = "HTTP bridge between reTerminal Sticky firmware and the homelab (Home Assistant, Hermes)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "loguru>=0.7.3",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
